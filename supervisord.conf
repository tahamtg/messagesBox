[supervisord]
nodaemon=true

[program:daphne]
directory=/app
command=daphne -b 0.0.0.0 -p 8000 massage.asgi:application
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr